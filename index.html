  <script>
    // Ultra-simple SDK initialization
    function initializeSDK() {
      console.log('Checking for SDK...');
      
      // Simple check and call
      if (window.sdk && window.sdk.actions && window.sdk.actions.ready) {
        console.log('Calling SDK ready...');
        window.sdk.actions.ready().catch(function(error) {
          console.log('SDK ready error (but this might be expected):', error);
        });
      } else {
        console.log('SDK not found or ready function not available');
        // Try to hide any splash screen elements anyway
        var splash = document.querySelector('.splash, #splash, .loading, #loading');
        if (splash) {
          splash.style.display = 'none';
          console.log('Hid splash screen element');
        }
      }
    }
    
    document.addEventListener('DOMContentLoaded', function() {
      console.log('DOM loaded');
      // Try immediately
      initializeSDK();
      // Try after a small delay
      setTimeout(initializeSDK, 500);
      // Try after a longer delay
      setTimeout(initializeSDK, 2000);
    });
  </script>
</body>
</html>
