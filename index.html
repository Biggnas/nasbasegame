<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Anime Runner</title>
  <meta name="fc:miniapp" content='{
    "version":"next",
    "imageUrl":"https://nasbasegame.vercel.app/embed-image.png",
    "button":{
      "title":"Play Now",
      "action":{
        "type":"launch_miniapp",
        "name":"Anime Runner",
        "url":"https://nasbasegame.vercel.app"
      }
    }
  }' />
  <!-- Farcaster MiniApp SDK - Local version -->
<script src="https://cdn.jsdelivr.net/npm/@farcaster/miniapp-sdk/dist/browser/miniapp-sdk.min.js"></script>

    <!-- Correct SDK ready() call -->
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        console.log("Checking MiniApp SDK...");
        if (window.sdk?.actions?.ready) {
          console.log("Calling sdk.actions.ready()...");
          await window.sdk.actions.ready();
          console.log("MiniApp is READY ✔");
        } else {
          console.warn("MiniApp SDK not detected");
        }
      } catch (e) {
        console.error("Error calling sdk.actions.ready():", e);
      }
    });
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Lexend', sans-serif;
    }
    
    body {
      background: #0d1117;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #111827;
      border-bottom: 1px solid #1f2937;
    }
    
    .title {
      font-weight: 600;
      font-size: 1.1rem;
    }
    
    .scores {
      display: flex;
      gap: 16px;
      font-size: 0.9rem;
      opacity: 0.9;
    }
    
    .stage-wrap {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }
    
    .stage {
      width: 95%;
      max-width: 600px;
      height: 260px;
      background: #151b23;
      border: 1px solid #1f2937;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
    }
    
    .ground {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: #374151;
    }
    
    .runner {
      position: absolute;
      bottom: 6px;
      left: 32px;
      width: 50px;
      height: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .runner-sprite {
      width: 42px;
      height: 56px;
    }
    
    .body {
      width: 14px;
      height: 36px;
      background: #1e3a8a;
      border-radius: 4px;
      margin-top: -4px;
      position: relative;
    }
    
    .arm, .leg {
      position: absolute;
      background: #1e3a8a;
      border-radius: 4px;
    }
    
    .arm {
      width: 6px;
      height: 20px;
      top: 4px;
    }
    
    .arm-left { left: -8px; }
    .arm-right { right: -8px; }
    
    .leg {
      width: 6px;
      height: 22px;
      bottom: -20px;
    }
    
    .leg-left { left: 2px; }
    .leg-right { right: 2px; }
    
    .obstacle {
      position: absolute;
      bottom: 6px;
      width: 26px;
      height: 30px;
      background: #9ca3af;
      border-radius: 4px;
    }
    
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px;
      z-index: 10;
    }
    
    .overlay-card {
      background: #111827;
      padding: 24px;
      border-radius: 10px;
      width: 94%;
      max-width: 300px;
      text-align: center;
      border: 1px solid #1f2937;
    }
    
    .big {
      font-size: 1.4rem;
      margin-bottom: 8px;
      font-weight: 600;
    }
    
    .muted {
      font-size: 0.85rem;
      opacity: 0.8;
    }
    
    .primary {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 500;
    }
    
    .primary:hover { background: #1d4ed8; }
    
    .hint {
      padding: 10px;
      text-align: center;
      font-size: 0.8rem;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="title">Anime Runner</div>
    <div class="scores">
      <div class="score">Score: <span id="score">0</span></div>
      <div class="hi">Hi: <span id="hi">0</span></div>
    </div>
  </header>

  <main class="stage-wrap">
    <div id="stage" class="stage" aria-label="game stage">
      <div id="ground" class="ground"></div>

      <!-- runner (SVG head + simple body) -->
      <div id="runner" class="runner" aria-hidden="true">
        <svg viewBox="0 0 120 160" class="runner-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <ellipse cx="60" cy="48" rx="20" ry="22" fill="#ffd8c4"/>
          <path d="M60 18c-12 0-22 8-28 18 6-8 18-14 28-14s22 6 28 14c-6-10-16-18-28-18z" fill="#1e1e2f"/>
          <ellipse cx="52" cy="48" rx="3.4" ry="4" fill="#111"/>
          <ellipse cx="68" cy="48" rx="3.4" ry="4" fill="#111"/>
          <path d="M54 60 q6 6 12 0" stroke="#5a2b1b" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        </svg>

        <div class="body">
          <div class="torso"></div>
          <div class="arm arm-left"></div>
          <div class="arm arm-right"></div>
          <div class="leg leg-left"></div>
          <div class="leg leg-right"></div>
        </div>
      </div>

      <!-- obstacles container -->
      <div id="obstacles"></div>

      <!-- START overlay (simple Start Screen) -->
      <div id="startOverlay" class="overlay">
        <div class="overlay-card">
          <h1 class="big">Anime Runner</h1>
          <p class="muted">Tap or press Space to jump. Avoid obstacles and get a high score!</p>
          <div style="height:8px;"></div>
          <button id="startBtn" class="primary">Start Game</button>
        </div>
      </div>

      <!-- GAME OVER overlay (hidden initially) -->
      <div id="gameOverOverlay" class="overlay" style="display:none;">
        <div class="overlay-card">
          <h2 id="gameOverTitle">Game Over</h2>
          <p id="gameOverSub">Final Score: <span id="finalScore">0</span></p>
          <div style="height:8px;"></div>
          <button id="retryBtn" class="primary">Play Again</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="hint">Tap / Click the stage (or press Space) to jump</footer>

  <script>
    // Handle Ethereum conflicts defensively
    try {
      if (typeof window.ethereum !== 'undefined') {
        console.log("Ethereum provider detected, handling safely");
      }
    } catch (e) {
      console.log("Ethereum conflict detected, continuing...");
    }
    
    // Game variables
    let gameRunning = false;
    let score = 0;
    let highScore = 0;
    let yVelocity = 0;
    let isJumping = false;
    let gameSpeed = 3.0;
    let nextSpawnTime = 0;
    let frameCount = 0;
    
    // DOM Elements
    let stage, runner, obstaclesContainer, scoreEl, hiEl;
    let startOverlay, gameOverOverlay, startBtn, retryBtn, finalScoreEl;
    
    // Initialize when DOM is loaded
    document.addEventListener('DOMContentLoaded', function() {
      // Get all game elements
      stage = document.getElementById("stage");
      runner = document.getElementById("runner");
      obstaclesContainer = document.getElementById("obstacles");
      scoreEl = document.getElementById("score");
      hiEl = document.getElementById("hi");
      startOverlay = document.getElementById("startOverlay");
      gameOverOverlay = document.getElementById("gameOverOverlay");
      startBtn = document.getElementById("startBtn");
      retryBtn = document.getElementById("retryBtn");
      finalScoreEl = document.getElementById("finalScore");
      
      // Set up event listeners
      startBtn.addEventListener('click', startGame);
      retryBtn.addEventListener('click', startGame);
      
      stage.addEventListener('click', function() {
        if (!gameRunning) {
          startGame();
        } else {
          jump();
        }
      });
      
      document.addEventListener('keydown', function(e) {
        if (e.code === "Space") {
          if (!gameRunning) {
            startGame();
          } else {
            jump();
          }
        }
      });
      
      // Initialize high score
      hiEl.textContent = highScore;
    });
    
    // Start the game
    function startGame() {
      // Reset game state
      gameRunning = true;
      score = 0;
      scoreEl.textContent = score;
      gameSpeed = 3.0;
      yVelocity = 0;
      isJumping = false;
      frameCount = 0;
      nextSpawnTime = Date.now() + 1500; // First obstacle after 1.5 seconds
      
      // Hide overlays
      startOverlay.style.display = "none";
      gameOverOverlay.style.display = "none";
      
      // Clear obstacles
      obstaclesContainer.innerHTML = "";
      
      // Position runner
      runner.style.bottom = "6px";
      
      // Start game loop
      gameLoop();
    }
    
    // Jump function
    function jump() {
      if (!gameRunning || isJumping) return;
      isJumping = true;
      yVelocity = 8.9;
    }
    
    // Spawn obstacle
    function spawnObstacle() {
      const obstacle = document.createElement("div");
      obstacle.className = "obstacle";
      obstacle.style.right = "-30px"; // Start off-screen to the right
      obstaclesContainer.appendChild(obstacle);
    }
    
    // Game loop
    function gameLoop() {
      if (!gameRunning) return;
      
      frameCount++;
      
      // Update score (slower now)
      if (frameCount % 5 === 0) { // Only update score every 5 frames
        score += 0.1;
        scoreEl.textContent = Math.floor(score);
      }
      
      // Apply gravity
      yVelocity -= 0.37;
      let newBottom = parseFloat(runner.style.bottom || "6") + yVelocity;
      
      if (newBottom <= 6) {
        newBottom = 6;
        yVelocity = 0;
        isJumping = false;
      }
      
      runner.style.bottom = newBottom + "px";
      
      // Spawn obstacles
      const now = Date.now();
      if (now >= nextSpawnTime) {
        spawnObstacle();
        nextSpawnTime = now + 1000 + Math.random() * 1000; // Next obstacle in 1-2 seconds
      }
      
      // Move obstacles and check collisions
      const obstacles = document.querySelectorAll(".obstacle");
      obstacles.forEach(obstacle => {
        // Move obstacle left
        const currentRight = parseFloat(obstacle.style.right || "0");
        obstacle.style.right = (currentRight + gameSpeed) + "px";
        
        // Remove obstacles that are off-screen
        if (currentRight > stage.offsetWidth) {
          obstacle.remove();
          return;
        }
        
        // Check collision (simplified)
        const runnerRect = runner.getBoundingClientRect();
        const obstacleRect = obstacle.getBoundingClientRect();
        
        // Simple collision detection
        if (runnerRect.right > obstacleRect.left && 
            runnerRect.left < obstacleRect.right &&
            runnerRect.bottom > obstacleRect.top) {
          endGame();
        }
      });
      
      // Increase game speed gradually
      if (frameCount % 100 === 0) {
        gameSpeed += 0.1;
      }
      
      // Continue loop
      requestAnimationFrame(gameLoop);
    }
    
    // End game
    function endGame() {
      gameRunning = false;
      
      // Update high score
      if (score > highScore) {
        highScore = Math.floor(score);
        hiEl.textContent = highScore;
      }
      
      // Show final score
      finalScoreEl.textContent = Math.floor(score);
      
      // Show game over screen
      gameOverOverlay.style.display = "flex";
    }
  </script>
  
  <script>
    // Proper SDK initialization following recommended approach
    async function initApp() {
      console.log('Initializing app and SDK...');
      
      try {
        // Check if we're in a MiniApp environment and SDK is available
        if (typeof window !== 'undefined' && window.sdk && window.sdk.actions && window.sdk.actions.ready) {
          console.log('SDK ready function found, calling it...');
          // Call the ready function to hide the splash screen
          await window.sdk.actions.ready();
          console.log('SDK ready called successfully!');
        } else {
          console.log('SDK not available or ready function not found');
          // Try to hide any splash screen elements anyway
          var splash = document.querySelector('.splash, #splash, .loading, #loading');
          if (splash) {
            splash.style.display = 'none';
            console.log('Hid splash screen element');
          }
        }
      } catch (err) {
        console.error("Error calling sdk.actions.ready():", err);
      }
    }
    
    // Initialize the app after DOM is loaded and ensure it runs on client side
    document.addEventListener('DOMContentLoaded', function() {
      console.log('DOM loaded, initializing app...');
      
      // Use setTimeout to ensure this runs after component mount
      setTimeout(function() {
        initApp().catch(function(error) {
          console.error('Error in initApp:', error);
        });
      }, 100);
    });
  </script>
</body>
</html>
